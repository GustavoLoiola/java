# =========================================
# EasyConvert - Configuracao da Aplicacao
# =========================================

spring.application.name=easyconvert-backend
server.port=${SERVER_PORT:8080}

# =========================================
# Banco de Dados (MySQL)
# =========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:easyconvert}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# JPA / Hibernate
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =========================================
# JWT
# =========================================
app.jwt.secret=${JWT_SECRET:mZ9k3f8s+3XwQpEwLxV5nWyq0v7bR2tQZ8Y6cA1dF4hJkP0oT9uVxZ2bE5gH8kL1}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =========================================
# Upload de Arquivos
# =========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

app.storage.upload-dir=${UPLOAD_DIR:./storage/uploads}
app.storage.converted-dir=${CONVERTED_DIR:./storage/converted}

# =========================================
# Conversao de Arquivos (LibreOffice headless)
# =========================================
app.conversion.soffice-path=${SOFFICE_PATH:soffice}
app.conversion.timeout-seconds=${CONVERSION_TIMEOUT:60}

# =========================================
# CORS (frontend rodando separado)
# =========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# =========================================
# Logging
# =========================================
logging.level.com.easyconvert=DEBUG
logging.level.org.springframework.security=INFO
